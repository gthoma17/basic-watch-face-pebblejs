name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Pebble Watch Face
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install Pebble SDK dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-dev python3-virtualenv libfreetype6-dev libpng-dev pkg-config
        
    - name: Setup Pebble SDK
      run: |
        python3 -m venv ~/.pebble-sdk
        source ~/.pebble-sdk/bin/activate
        pip3 install --upgrade pip setuptools wheel
        pip3 install pebble-sdk
        echo "$HOME/.pebble-sdk/bin" >> $GITHUB_PATH
        
    - name: Verify Pebble SDK installation
      run: |
        source ~/.pebble-sdk/bin/activate
        pebble --version || echo "Pebble SDK not found in PATH"
        
    - name: Build watchface
      run: |
        source ~/.pebble-sdk/bin/activate
        pebble clean || true
        pebble build
        ls -la build/
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pebble-watchface
        path: build/*.pbw
        
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: pebble-watchface
        path: build/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.pbw
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

