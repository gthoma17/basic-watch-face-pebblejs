name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Pebble Watchface
    runs-on: ubuntu-22.04
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Install Python 2.7
      run: |
        # Add deadsnakes PPA for Python 2.7
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        
        # Install Python 2.7 and dependencies
        sudo apt-get install -y python2.7 python2.7-dev curl
        
        # Install pip for Python 2.7
        curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
        sudo python2.7 get-pip.py
        
        # Install additional dependencies needed for Pebble SDK
        sudo apt-get install -y libfreetype6-dev libffi-dev libglib2.0-dev pkg-config
        
    - name: Install Pebble SDK
      run: |
        # Install pebble-tool
        pip2.7 install --user pebble-tool
        
        # Add pip user bin to PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
    - name: Install Pebble SDK
      run: |
        # Create SDK directory
        mkdir -p ~/.pebble-sdk
        
        # Download and install SDK (this may take a few minutes)
        pebble sdk install latest || echo "SDK install completed with warnings"
        
    - name: Build watchface
      run: |
        # Build for all platforms
        pebble build
      continue-on-error: false
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pebble-watchface
        path: build/*.pbw
        
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Determine next version
      id: next_version
      run: |
        # Get the latest tag that matches the pattern 0.0.x
        LATEST_TAG=$(git tag -l "0.0.*" | sort -V | tail -n 1)
        
        if [ -z "$LATEST_TAG" ]; then
          # No existing tags, start with 0.0.1
          NEW_VERSION="0.0.1"
        else
          # Extract patch version and increment
          PATCH=$(echo $LATEST_TAG | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="0.0.$NEW_PATCH"
        fi
        
        echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "Next version: ${NEW_VERSION}"
        
    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag ${{ steps.next_version.outputs.new_version }}
        git push origin ${{ steps.next_version.outputs.new_version }}
      
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: pebble-watchface
        path: build/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.next_version.outputs.new_version }}
        files: build/*.pbw
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
