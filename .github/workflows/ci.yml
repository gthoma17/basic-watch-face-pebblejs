name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Pebble Watchface
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python 2.7
      uses: actions/setup-python@v4
      with:
        python-version: '2.7'
        
    - name: Install Pebble SDK
      run: |
        # Install dependencies
        sudo apt-get update
        sudo apt-get install -y python-pip python-dev libfreetype6-dev libffi-dev libglib2.0-dev
        
        # Install pebble-tool
        pip install --user pebble-tool
        
        # Add pip user bin to PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
    - name: Install Pebble SDK
      run: |
        # Create SDK directory
        mkdir -p ~/.pebble-sdk
        
        # Download and install SDK (this may take a few minutes)
        pebble sdk install latest || echo "SDK install completed with warnings"
        
    - name: Build watchface
      run: |
        # Build for all platforms
        pebble build
      continue-on-error: false
        
    - name: Extract version from tag
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="dev-${GITHUB_SHA::7}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version: ${VERSION}"
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: pebble-watchface
        path: build/*.pbw
        
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: pebble-watchface
        path: build/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.pbw
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
